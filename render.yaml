services:
  - type: web
    name: scode-cms-api
    runtime: node
    plan: starter
    rootDir: scode-cms
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: cms-uploads
      mountPath: /var/data
      sizeGB: 1
